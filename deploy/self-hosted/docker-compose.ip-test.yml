services:
  web:
    ports: !override
      - "127.0.0.1:8080:81"
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes: !override
      - /opt/little-tally/app/dist:/usr/share/nginx/html:ro
      - /opt/little-tally/stack/ip-test-web.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/little-tally/tls/letsencrypt:/etc/letsencrypt:ro
      - /opt/little-tally/tls/acme-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:81/health.json"]
