# Resolve the API gateway through Docker embedded DNS at run time.
# api-gw (supabase-envoy) is recreated on upgrades and gets a new container IP;
# nginx resolves a literal hostname in proxy_pass only when the config is loaded,
# so a recreated container leaves a stale address and every proxied request
# fails with 502 (connect() failed: Connection refused).
# Keep the upstream + resolver pair: the proxy_pass directives below must point
# at this upstream, never at a literal "api-gw:8000", and never at a fixed IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream tally_api_gw {
    zone tally_api_gw 64k;
    server api-gw:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 7m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location ^~ /auth/v1/admin/ { return 404; }
    location /auth/v1/ {
        proxy_pass http://tally_api_gw;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /rest/v1/ {
        proxy_pass http://tally_api_gw;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /functions/v1/tally-accounts {
        proxy_pass http://tally_api_gw;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /functions/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
