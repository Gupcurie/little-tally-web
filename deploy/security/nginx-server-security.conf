    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req zone=tally_requests burst=100 nodelay;
    limit_req_status 429;
    limit_conn tally_connections 30;
    limit_conn_status 429;
    access_log /var/log/tally/access.jsonl tally_security;
    include /etc/tally-security/blocked.conf;
