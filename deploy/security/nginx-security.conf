# Included inside http{} before server blocks.
limit_req_zone $binary_remote_addr zone=tally_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tally_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=tally_connections:10m;
log_format tally_security escape=json '{"at":$msec,"ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status}';
