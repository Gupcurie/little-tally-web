<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>拆弹专家 · 管理员登录</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/admin/static/style.css">
</head>
<body class="center">
<main class="login">
  <img class="admin-mars-mark" src="/icon-192.png" alt="火星演唱会标志"><h1>拆弹专家 · 管理员登录</h1>
  <p class="muted">仅供站点管理员使用。</p>
  <form id="form" method="post" action="/admin/api/login" autocomplete="off">
    <label for="pw">管理口令</label>
    <input id="pw" name="password" type="password" required minlength="6" autocomplete="current-password" spellcheck="false">
    <div data-position-code hidden>
      <label for="position-code">管理员位置口令</label>
      <input id="position-code" name="position_code" type="password" inputmode="numeric"
             pattern="[0-9]{4}" maxlength="4" autocomplete="off" data-code-input disabled>
    </div>
    <button id="go" type="submit">登录</button>
    <p id="msg" class="msg" role="status"></p>
  </form>
</main>
<script src="/admin/static/login.js?v=20261106-position-code" defer></script>
</body>
</html>
