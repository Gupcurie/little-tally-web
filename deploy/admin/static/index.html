<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>小小记 · 账号管理</title>
<link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <h1>小小记 · 账号管理</h1>
    </div>
    <button id="logout" class="ghost" type="button">退出</button>
  </header>

  <div id="error" class="banner error" hidden></div>

  <section class="cards" id="summary" aria-label="概览">
    <div class="card"><span class="k">账号总数</span><strong id="s-total">–</strong></div>
    <div class="card"><span class="k">正常</span><strong id="s-active">–</strong></div>
    <div class="card"><span class="k">已禁用</span><strong id="s-banned">–</strong></div>
    <div class="card"><span class="k">有账本</span><strong id="s-ledger">–</strong></div>
    <div class="card"><span class="k">物品</span><strong id="s-items">–</strong></div>
    <div class="card"><span class="k">记录</span><strong id="s-records">–</strong></div>
    <div class="card"><span class="k">近 7 天登录</span><strong id="s-seven">–</strong></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索用户名" autocomplete="off" spellcheck="false">
      <button id="reload" class="ghost" type="button">刷新</button>
      <span id="updated" class="muted"></span>
    </div>

    <div class="table-head">
      <span>用户名</span><span>状态</span><span>物品 / 记录</span><span>最近登录</span><span>操作</span>
    </div>
    <div id="rows" class="rows"></div>
  </section>

  <section class="panel">
    <h2>最近操作</h2>
    <div id="audit" class="audit"></div>
  </section>

  <p class="foot muted">仅管理员可见 · 本页不下发任何服务端密钥</p>
</div>

<div id="detail" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="d-title">账号详情</h2>
      <button id="d-close" class="ghost" type="button">关闭</button>
    </div>
    <div id="d-body" class="modal-body"></div>
  </div>
</div>

<div id="secret" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>新密码（只显示一次）</h2>
      <button id="s-close" class="ghost" type="button">关闭</button>
    </div>
    <div class="modal-body">
      <p id="s-who" class="muted"></p>
      <code id="s-pass" class="pass"></code>
      <p class="muted">把这串密码交给该用户，请勿截图外传。关闭后无法再次查看。</p>
    </div>
  </div>
</div>

<script src="/admin/static/app.js" defer></script>
</body>
</html>
